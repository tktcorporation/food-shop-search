# プロジェクト固有の mise 設定。
# 横断共有ツールは `.config/mise/conf.d/shared.toml`（ziku 同期）を参照。

[tools]
node = ["22", "24"]
python = "3.14"
pnpm = "10"

# Browser automation
"npm:playwright" = "latest"

[tasks.chromium-path]
run = "ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1"
description = "Get Playwright Chromium executable path"
